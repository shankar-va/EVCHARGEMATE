services:
  mongo:
    image: mongo:7.0
    container_name: evcm-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - evcm-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    container_name: evcm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/src/.env
    environment:
      # Overrides MONGO_URI from .env when running inside Compose network
      - MONGO_URI=mongodb://mongo:27017/evchargemate
      - CLIENT_URL=http://localhost:3000
      - PORT=5000
    volumes:
      - backend_logs:/usr/src/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - evcm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
    container_name: evcm-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - evcm-net

volumes:
  mongo_data:
    driver: local
  backend_logs:
    driver: local

networks:
  evcm-net:
    driver: bridge